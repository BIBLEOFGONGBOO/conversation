<!doctype html>
<html lang="en">
<head>
  <!-- =========================================================================
       🟥 BLOCK 1000: APPLICATION DOCUMENT
       ========================================================================= -->

  <!-- =========================================================================
       🟩 BLOCK 1100: DOCUMENT HEAD
       ========================================================================= -->

  <!-- =========================================================================
       🟦 BLOCK 1110: MOBILE VIEWPORT AND ASSETS
       ========================================================================= -->

  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Gongboo Conversation</title>

  <link
    rel="stylesheet"
    href="gongboo-ui.css"
  >
</head>

<body>
  <!-- =========================================================================
       🟥 BLOCK 1000: APPLICATION DOCUMENT
       ========================================================================= -->

  <!-- =========================================================================
       🟩 BLOCK 1200: APPLICATION BODY
       ========================================================================= -->

         <!-- =========================================================================
       🟦 BLOCK 1210: MOBILE APPLICATION SHELL
       ========================================================================= -->

  <main
    id="conversationApp"
    class="conversation-app"
  >

       <!-- =======================================================================
     🟦 BLOCK 1212: TOP SYSTEM, PLAY, STOP, AND SETTINGS BUTTONS
     ======================================================================= -->

<header class="conversation-header">
  <div class="conversation-system-split">
    <button
      id="systemMenuButton"
      type="button"
      aria-label="Open system menu"
      aria-controls="systemMenuPanel"
      aria-expanded="false"
    >
      ▦
    </button>

    <section
      id="systemMenuPanel"
      class="conversation-menu"
      hidden
    >
      <button
        type="button"
        data-system-url="https://bibleofgongboo.github.io/conversation/"
      >
        CONVERSATION
      </button>

      <button
        type="button"
        disabled
      >
        LICENSE
      </button>

      <button
        type="button"
        data-system-url="https://bibleofgongboo.github.io/biblenew/"
      >
        BIBLE
      </button>

      <button
        type="button"
        data-system-url="https://bibleofgongboo.github.io/anne/"
      >
        EASY LEARNING
      </button>
    </section>
  </div>

  <div class="conversation-play-split">
    <button
      id="playButton"
      type="button"
      aria-label="Play current conversation"
    >
      PLAY
    </button>

    <button
      id="playMenuButton"
      type="button"
      aria-label="Open play menu"
      aria-controls="playMenuPanel"
      aria-expanded="false"
    >
      ▾
    </button>
  </div>

  <button
    id="stopButton"
    type="button"
    aria-label="Stop playback and role play"
  >
    STOP
  </button>

  <button
    id="settingsButton"
    type="button"
    aria-label="Open settings"
    aria-controls="settingsPanel"
    aria-expanded="false"
  >
    ⚙
  </button>
</header>

<!-- =======================================================================
     END: TOP SYSTEM, PLAY, STOP, AND SETTINGS BUTTONS
     ======================================================================= -->
    


<!-- =======================================================================
     🟦 BLOCK 1216: PRACTICE CONTROL MENU
     ======================================================================= -->

<section
  id="playMenuPanel"
  class="conversation-menu"
  hidden
>
  <button
    id="playModeToggleButton"
    class="play-mode-toggle"
    type="button"
    aria-pressed="false"
  >
    COMPUTER
  </button>

  <button
    id="practiceStartStopButton"
    class="practice-start-stop-toggle"
    type="button"
    aria-pressed="false"
  >
    START
  </button>

  <button
    id="practiceModeToggleButton"
    class="play-practice-toggle"
    type="button"
    aria-pressed="false"
  >
    ROLE<br>PLAY
  </button>
</section>

<!-- =======================================================================
     END: PRACTICE CONTROL MENU
     ======================================================================= -->



    <!-- =======================================================================
     🟦 BLOCK 1218: CONVERSATION SETTINGS MENU
     ======================================================================= -->

<section
  id="settingsPanel"
  class="conversation-menu"
  hidden
>
  <div class="conversation-settings-actions">
    <button
      id="psgButton"
      type="button"
    >
      PSG
    </button>

    <button
      id="chunkButton"
      type="button"
    >
      CHUNK
    </button>
  </div>

  <label class="conversation-setting-row">
    <span>PASS</span>

    <input
      id="passRange"
      type="range"
      min="1"
      max="100"
      step="1"
      value="1"
      aria-label="Pass score"
    >

    <output id="passValue">1%</output>
  </label>

  <label class="conversation-setting-row">
    <span>MIC DELAY</span>

    <input
      id="delayRange"
      type="range"
      min="0.5"
      max="10"
      step="0.5"
      value="0.5"
      aria-label="Microphone delay"
    >

    <output id="delayValue">0.5s</output>
  </label>

  <div class="conversation-speed-loop-row">
    <label class="conversation-setting-row">
      <span>SPEED</span>

      <input
        id="speechSpeedRange"
        type="range"
        min="0.5"
        max="1.5"
        step="0.1"
        value="1"
        aria-label="Speech speed"
      >
    </label>

    <button
      id="playLoopToggle"
      type="button"
      aria-label="Repeat current passage"
      aria-pressed="false"
    >
      ↻ OFF
    </button>
  </div>

  <div class="conversation-language-row">
    <span class="conversation-language-label">
      LANG
    </span>

    <label class="conversation-language-choice">
      <span>1ST</span>

      <select
        id="primaryLanguageSelect"
        aria-label="Primary language"
      >
        <option value="EN">EN</option>
      </select>
    </label>

    <label class="conversation-language-choice">
      <span>2ND</span>

      <select
        id="secondaryLanguageSelect"
        aria-label="Secondary language"
      >
        <option value="NONE">NONE</option>
      </select>
    </label>
  </div>
</section>

<!-- =======================================================================
     END: CONVERSATION SETTINGS MENU
     ======================================================================= -->


<!-- =======================================================================
     🟦 BLOCK 1219: CONVERSATION DIRECTORY
     ======================================================================= -->

<section
  id="conversationDirectory"
  class="conversation-directory"
  aria-label="Conversation directory"
>
  <nav
    id="conversationDirectoryBreadcrumb"
    class="conversation-directory-breadcrumb"
    aria-label="Directory path"
  ></nav>

  <div
    id="conversationDirectoryList"
    class="conversation-directory-list"
  ></div>
</section>

<!-- =======================================================================
     END: CONVERSATION DIRECTORY
     ======================================================================= -->



    <!-- =======================================================================
         🟦 BLOCK 1220: LESSON, NAVIGATION, AND FOOTER
         ======================================================================= -->

    <section
      id="conversationStatus"
      class="conversation-status"
      aria-live="polite"
    >
      Ready
    </section>

    <section
      id="conversationLesson"
      class="conversation-lesson"
      hidden
    >
      <div id="conversationMeta"></div>

      <div id="conversationTurns"></div>
    </section>

    <nav
      class="conversation-bottom-navigation"
      aria-label="Passage navigation"
    >
      <button
        id="previousButton"
        type="button"
      >
        ◀ PREV
      </button>

      <button
        id="nextButton"
        type="button"
      >
        NEXT ▶
      </button>
    </nav>

    <footer class="conversation-footer">
      GONGBOO.ORG : EASY LEARNING
    </footer>

    <!-- =======================================================================
         END: LESSON, NAVIGATION, AND FOOTER
         ======================================================================= -->

  </main>

  <!-- =========================================================================
       END: MOBILE APPLICATION SHELL
       ========================================================================= -->

  <script src="conversation-main.js"></script>
</body>
</html>
